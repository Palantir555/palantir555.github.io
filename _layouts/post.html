---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <span class="post-date">{{ page.date | date_to_string }}
  </span>
  {{ content }}
</div>

<a href="https://twitter.com/share" class="twitter-share-button" data-via="Palantir555">Tweet</a>
<div class="related">
  <h2>Related Posts</h2>
  <ul class="related-posts">
    {% for post in site.related_posts limit:3 %}
      <li>
        <h3>
          <a href="{{ post.url }}">
            {{ post.title }}
            <small>{{ post.date | date_to_string }}</small>
          </a>
        </h3>
      </li>
    {% endfor %}
  </ul>
</div>

<div id="remark42"></div>
<script>
var remark_config = {
  host: "https://comments.jcjc-dev.com",
  site_id: "jcjc-dev",
  url: "{{ site.url }}{{ page.url | replace:'index.html','' }}"
};

(function(c) {
  for (var i = 0; i < c.length; i++) {
    var d = document, s = d.createElement('script');
    s.src = remark_config.host + '/web/' + c[i] + '.js';
    s.defer = true;
    (d.head || d.body).appendChild(s);
  }
})(remark_config.components || ['embed']);
</script>
<noscript>Please enable JavaScript to view the comments.</noscript>
